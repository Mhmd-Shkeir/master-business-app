name: Figma 27 Screens Browser Validation

on:
  push:
    branches:
      - "seqa/figma-all-screens"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figma-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright for browser tests (without changing app lockfile)
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Figma screen and interaction tests
        run: npx playwright test --config playwright.config.ts --reporter=line
      - name: Attach browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: figma-failure-screenshots
          path: frontend/test-results/
          retention-days: 7
