services:
  db:
    image: postgres:16-alpine
    container_name: master-business-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: master_business
    ports:
      - "5432:5432"
    volumes:
      - master-business-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d master_business"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  master-business-postgres:
